<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Patterns and Gradients -->
  <defs>
    <pattern id="waterPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4A90E2" opacity="0.5"/>
      <circle cx="10" cy="10" r="2" fill="#6BB6FF" opacity="0.6"/>
      <circle cx="30" cy="25" r="2" fill="#6BB6FF" opacity="0.6"/>
    </pattern>
    
    <pattern id="riverbedPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#8B6914" opacity="0.8"/>
      <circle cx="8" cy="8" r="1.5" fill="#6B5214" opacity="0.7"/>
      <circle cx="22" cy="18" r="1" fill="#6B5214" opacity="0.7"/>
    </pattern>
    
    <pattern id="pathPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#D3D3D3"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#B0B0B0" stroke-width="1"/>
    </pattern>
    
    <pattern id="wallPattern" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#808080"/>
      <rect x="1" y="1" width="13" height="13" fill="#707070" opacity="0.5"/>
    </pattern>
    
    <marker id="arrowX" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#E74C3C"/>
    </marker>
    
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="3" refY="9" orient="auto">
      <path d="M0,0 L6,0 L3,9 z" fill="#27AE60"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    Top-Down Orthographic View - River Environment
  </text>
  
  <!-- Coordinate System -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" font-size="12" fill="#666" font-weight="bold">Screen Coordinates:</text>
    <line x1="0" y1="15" x2="40" y2="15" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowX)"/>
    <text x="45" y="20" font-size="11" fill="#E74C3C">+X (East)</text>
    <line x1="0" y1="15" x2="0" y2="55" stroke="#27AE60" stroke-width="2" marker-end="url(#arrowY)"/>
    <text x="5" y="70" font-size="11" fill="#27AE60">+Y (Down)</text>
    <text x="0" y="85" font-size="9" fill="#999" font-style="italic">screenY = worldY - worldZ</text>
  </g>
  
  <!-- Main Environment Layers -->
  <g transform="translate(200, 180)">
    
    <!-- Pier/Walkway (Z=100) -->
    <rect x="0" y="0" width="500" height="60" fill="url(#pathPattern)" stroke="#999" stroke-width="2"/>
    <text x="250" y="35" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Pier/Walkway (Z=100)</text>
    
    <!-- Avatar -->
    <circle cx="250" cy="30" r="8" fill="#FF6B6B" stroke="#CC0000" stroke-width="2"/>
    <text x="265" y="35" font-size="10" fill="#CC0000" font-weight="bold">Avatar</text>
    
    <!-- River Wall (Z=100→0) -->
    <rect x="0" y="60" width="500" height="140" fill="url(#wallPattern)" stroke="#666" stroke-width="2"/>
    <text x="250" y="125" text-anchor="middle" font-size="14" fill="#FFF" font-weight="bold">River Wall</text>
    <text x="250" y="143" text-anchor="middle" font-size="11" fill="#DDD">(Z=100 → 0)</text>
    
    <!-- Riverbed (Z=60→0) - drawn before water -->
    <rect x="0" y="140" width="500" height="60" fill="url(#riverbedPattern)" stroke="#6B5214" stroke-width="2"/>
    <text x="250" y="165" text-anchor="middle" font-size="14" fill="#3C2A0A" font-weight="bold">Riverbed</text>
    <text x="250" y="183" text-anchor="middle" font-size="11" fill="#3C2A0A">(Z=60 → 0)</text>
    
    <!-- Magnet on riverbed -->
    <circle cx="250" cy="190" r="7" fill="#888" stroke="#333" stroke-width="2"/>
    <text x="265" y="195" font-size="10" fill="#333" font-weight="bold">Magnet</text>
    
    <!-- Water Surface (Z=60→0) - drawn after riverbed to occlude -->
    <rect x="0" y="140" width="500" height="60" fill="url(#waterPattern)" stroke="#2E86AB" stroke-width="2"/>
    <text x="250" y="170" text-anchor="middle" font-size="13" fill="#005A8A" font-weight="bold">Water Surface (Z=60 → 0)</text>
    
    <!-- Waves on water surface -->
    <path d="M 50,143 Q 70,138 90,143 T 130,143" stroke="#6BB6FF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 200,145 Q 220,140 240,145 T 280,145" stroke="#6BB6FF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 350,143 Q 370,138 390,143 T 430,143" stroke="#6BB6FF" stroke-width="2" fill="none" opacity="0.8"/>
    
    <!-- Rope with 3D physics -->
    <path d="M 250,30 Q 250,90 250,140 Q 250,165 250,190" 
          stroke="#8B4513" 
          stroke-width="4" 
          fill="none" 
          stroke-linecap="round" 
          opacity="0.95"/>
    
    <!-- Verlet points -->
    <circle cx="250" cy="30" r="3" fill="#654321"/>
    <circle cx="250" cy="90" r="3" fill="#654321"/>
    <circle cx="250" cy="140" r="3" fill="#654321"/>
    <circle cx="250" cy="165" r="3" fill="#654321"/>
    <circle cx="250" cy="190" r="3" fill="#654321"/>
    
    <text x="270" y="115" font-size="11" fill="#654321" font-weight="bold">Rope</text>
    <text x="270" y="128" font-size="9" fill="#654321">(3D Verlet)</text>
    
    <!-- Z-Height Scale -->
    <g transform="translate(520, 0)">
      <text x="0" y="15" font-size="12" fill="#666" font-weight="bold">Z-Heights:</text>
      
      <line x1="0" y1="30" x2="25" y2="30" stroke="#333" stroke-width="1"/>
      <text x="30" y="35" font-size="11" fill="#333" font-weight="bold">Z = 100</text>
      <text x="80" y="35" font-size="9" fill="#666">(Pier)</text>
      
      <line x1="0" y1="140" x2="25" y2="140" stroke="#2E86AB" stroke-width="2"/>
      <text x="30" y="145" font-size="11" fill="#2E86AB" font-weight="bold">Z = 60</text>
      <text x="75" y="145" font-size="9" fill="#2E86AB">(Water top)</text>
      
      <line x1="0" y1="200" x2="25" y2="200" stroke="#6B5214" stroke-width="2"/>
      <text x="30" y="205" font-size="11" fill="#6B5214" font-weight="bold">Z = 0</text>
      <text x="70" y="205" font-size="9" fill="#6B5214">(Riverbed)</text>
      
      <!-- Bracket showing water/riverbed same dimensions -->
      <path d="M 10,140 L 10,200" stroke="#FF6600" stroke-width="2"/>
      <circle cx="10" cy="140" r="3" fill="#FF6600"/>
      <circle cx="10" cy="200" r="3" fill="#FF6600"/>
      <text x="15" y="175" font-size="9" fill="#FF6600" font-weight="bold">Same</text>
      <text x="15" y="186" font-size="9" fill="#FF6600" font-weight="bold">size</text>
    </g>
  </g>
  
  <!-- Side View Reference -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-size="12" fill="#666" font-weight="bold">Side View (for reference):</text>
    
    <!-- Pier -->
    <rect x="10" y="10" width="30" height="15" fill="url(#pathPattern)" stroke="#999" stroke-width="1"/>
    <text x="45" y="20" font-size="9" fill="#666">Pier</text>
    
    <!-- Wall -->
    <rect x="10" y="25" width="30" height="40" fill="url(#wallPattern)" stroke="#666" stroke-width="1"/>
    <text x="45" y="43" font-size="9" fill="#666">Wall</text>
    
    <!-- Riverbed and Water (overlapping) -->
    <rect x="45" y="45" width="30" height="20" fill="url(#riverbedPattern)" stroke="#6B5214" stroke-width="1"/>
    <rect x="45" y="45" width="30" height="20" fill="url(#waterPattern)" stroke="#2E86AB" stroke-width="1"/>
    
    <text x="80" y="52" font-size="9" fill="#2E86AB">Water</text>
    <text x="80" y="62" font-size="9" fill="#6B5214">Bed</text>
    
    <text x="10" y="80" font-size="8" fill="#999" font-style="italic">Water occludes bed</text>
  </g>
  
  <!-- Drawing Order Explanation -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="800" height="140" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="5"/>
    
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#333">Layer Structure &amp; Rendering:</text>
    
    <text x="40" y="50" font-size="11" fill="#555">
      • <tspan font-weight="bold">Pier/Walkway</tspan>: Full width strip at top (Z=100) - where avatar stands
    </text>
    <text x="40" y="68" font-size="11" fill="#555">
      • <tspan font-weight="bold">River Wall</tspan>: Full width strip (Z=100→0) - separates pier from water
    </text>
    <text x="40" y="86" font-size="11" fill="#555">
      • <tspan font-weight="bold">Riverbed &amp; Water</tspan>: Same width/position (Z=60→0)
    </text>
    <text x="40" y="104" font-size="11" fill="#555">
      • <tspan font-weight="bold">Drawing order</tspan>: Riverbed → Wall → Water (back to front)
    </text>
    <text x="40" y="122" font-size="11" fill="#555">
      • Water surface occludes both riverbed top and wall middle section
    </text>
    
    <text x="470" y="50" font-size="11" fill="#E74C3C" font-weight="bold">Projection Formula:</text>
    <text x="490" y="68" font-size="10" fill="#666">screenX = worldX</text>
    <text x="490" y="86" font-size="10" fill="#666">screenY = worldY - worldZ</text>
    <text x="490" y="104" font-size="9" fill="#999" font-style="italic">Higher Z → Higher on screen</text>
    <text x="490" y="120" font-size="9" fill="#999" font-style="italic">(Lower Y coordinate)</text>
  </g>
</svg>