<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550">
  <defs>
    <!-- Water pattern for transparency effect -->
    <pattern id="waterPattern" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="30" height="30" fill="#3498db" opacity="0.5"/>
      <path d="M0 15 Q7 10, 15 15 T30 15" stroke="#5dade2" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M0 25 Q7 20, 15 25 T30 25" stroke="#5dade2" stroke-width="1" fill="none" opacity="0.4"/>
    </pattern>
    
    <!-- Riverbed texture -->
    <pattern id="riverbedPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#5c4d3d"/>
      <circle cx="4" cy="4" r="2" fill="#4a3d2d"/>
      <circle cx="14" cy="10" r="3" fill="#6b5c4c"/>
      <circle cx="8" cy="16" r="1.5" fill="#3a2d1d"/>
      <circle cx="17" cy="3" r="1" fill="#4a3d2d"/>
    </pattern>
    
    <!-- Walkway texture -->
    <pattern id="walkwayPattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#7f8c8d"/>
      <rect x="0" y="0" width="20" height="20" fill="#8a979a" opacity="0.5"/>
      <rect x="20" y="20" width="20" height="20" fill="#8a979a" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="550" fill="#1a252f"/>
  
  <!-- 
    SPATIAL LAYOUT (using 25px per world unit for clarity):
    
    Avatar hand: Z=4.2 -> offset = -105px from baseline
    Walkway:     Z=3   -> offset = -75px from baseline
    Water:       Z=1   -> offset = -25px from baseline  
    Riverbed:    Z=0   -> offset = 0px (baseline)
    
    Baseline (worldY=0, Z=0) starts at screenY=200
    
    Both riverbed and water surface span worldY from 0 to 6 (150px height)
    Riverbed:    screenY = 200 to 350 (worldY 0-6, Z=0)
    Water:       screenY = 175 to 325 (worldY 0-6, Z=1, shifted up 25px)
  -->
  
  <!-- === LAYER 1: Walkway (extended up for avatar backdrop) === -->
  <!-- Walkway at Z=3, worldY around 0, so screenY = 0 - 75 = negative, we position at top -->
  <!-- Extended upward for avatar backdrop -->
  <rect x="50" y="20" width="500" height="105" fill="url(#walkwayPattern)" stroke="#5d6d7e" stroke-width="2"/>
  
  <!-- Walkway surface edge (Z=3, worldY=0) at screenY = 0 - 75 = 125 relative to our baseline -->
  <line x1="50" y1="125" x2="550" y2="125" stroke="#4a5a6a" stroke-width="4"/>
  
  <!-- === LAYER 2: River Wall Face === -->
  <!-- Between walkway (Z=3) and water surface (Z=1) -->
  <!-- Height = (3-1) * 25 = 50px -->
  <rect x="50" y="125" width="500" height="50" fill="#6c5b4a" stroke="#5d4e3d" stroke-width="2"/>
  <line x1="50" y1="145" x2="550" y2="145" stroke="#5d4e3d" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="160" x2="550" y2="160" stroke="#5d4e3d" stroke-width="1" opacity="0.5"/>
  
  <!-- === LAYER 3: Riverbed (Z=0) === -->
  <!-- Riverbed spans worldY 0 to 6, at Z=0 -->
  <!-- screenY = worldY - 0, so from 175+25=200 to 200+150=350 -->
  <rect x="50" y="200" width="500" height="150" fill="url(#riverbedPattern)" stroke="#4a3d2d" stroke-width="2"/>
  
  <!-- === LAYER 4: Items on riverbed === -->
  <!-- Items sit on riverbed (Z=0), at various worldY positions -->
  <g>
    <!-- Old boot at worldY ~2 -> screenY = 200 + 50 = 250 -->
    <ellipse cx="180" cy="260" rx="22" ry="14" fill="#3d2817"/>
    <ellipse cx="175" cy="255" rx="8" ry="12" fill="#2d1807"/>
    
    <!-- Rusty can at worldY ~1 -> screenY = 200 + 25 = 225 -->
    <rect x="300" y="220" width="18" height="28" fill="#8b5a2b" rx="2"/>
    <ellipse cx="309" cy="220" rx="9" ry="4" fill="#9b6a3b"/>
    
    <!-- Key at worldY ~4 -> screenY = 200 + 100 = 300 -->
    <circle cx="420" cy="300" r="6" fill="#d4af37"/>
    <rect x="420" y="298" width="15" height="4" fill="#d4af37"/>
    <rect x="432" y="295" width="3" height="5" fill="#d4af37"/>
    
    <!-- Coin at worldY ~3 -> screenY = 200 + 75 = 275 -->
    <circle cx="250" cy="280" r="10" fill="#c0c0c0"/>
    <circle cx="250" cy="280" r="7" fill="#a8a8a8"/>
  </g>
  
  <!-- === LAYER 5: Water Surface (Z=1) === -->
  <!-- Same worldY extent as riverbed (0 to 6), but at Z=1 -->
  <!-- screenY = worldY - 1, so shifted up 25px: from 175 to 325 -->
  <rect x="50" y="175" width="500" height="150" fill="url(#waterPattern)"/>
  <line x1="50" y1="175" x2="550" y2="175" stroke="#2980b9" stroke-width="3"/>
  
  <!-- === EXPOSED RIVERBED STRIP (debugging artifact) === -->
  <!-- The riverbed from screenY 325 to 350 is not covered by water -->
  <!-- This is worldY 5-6 on riverbed, which would need water at worldY 6-7 to cover -->
  <text x="300" y="342" text-anchor="middle" fill="#e74c3c" font-family="monospace" font-size="9" opacity="0.8">↑ exposed riverbed (extend water to cover)</text>
  
  <!-- === LAYER 6: Avatar on walkway === -->
  <g transform="translate(120, 50)">
    <!-- Shadow on walkway -->
    <ellipse cx="0" cy="75" rx="20" ry="8" fill="#000" opacity="0.3"/>
    
    <!-- Legs -->
    <rect x="-12" y="50" width="10" height="25" fill="#2c3e50" rx="3"/>
    <rect x="2" y="50" width="10" height="25" fill="#2c3e50" rx="3"/>
    
    <!-- Body -->
    <rect x="-15" y="20" width="30" height="35" fill="#e74c3c" rx="5"/>
    
    <!-- Head -->
    <circle cx="0" cy="8" r="14" fill="#f5d0c5"/>
    
    <!-- Hair -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#5d4037"/>
    
    <!-- Arms -->
    <line x1="-15" y1="30" x2="-25" y2="50" stroke="#f5d0c5" stroke-width="8" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="35" y2="20" stroke="#f5d0c5" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Fishing rod -->
    <line x1="35" y1="20" x2="70" y2="5" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    <circle cx="70" cy="5" r="3" fill="#666"/>
    
    <!-- Fishing line to magnet -->
    <path d="M70 5 Q 120 100, 180 210" stroke="#444" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- === LAYER 7: Magnet (on riverbed, under water) === -->
  <g transform="translate(180, 260)">
    <rect x="-10" y="-20" width="20" height="25" fill="#c0392b" rx="3"/>
    <rect x="-12" y="5" width="10" height="8" fill="#e74c3c" rx="1"/>
    <rect x="2" y="5" width="10" height="8" fill="#3498db" rx="1"/>
    <circle cx="0" cy="-20" r="4" fill="#666"/>
  </g>
  
  <!-- === ANNOTATIONS === -->
  
  <!-- Height scale on right side -->
  <g transform="translate(570, 20)">
    <line x1="0" y1="0" x2="0" y2="335" stroke="#ecf0f1" stroke-width="1" opacity="0.7"/>
    
    <!-- Z=4.2 avatar hand approx -->
    <line x1="-8" y1="30" x2="8" y2="30" stroke="#ecf0f1" stroke-width="2"/>
    <text x="-45" y="34" fill="#ecf0f1" font-family="monospace" font-size="9">Z≈4.2</text>
    
    <!-- Z=3 walkway surface -->
    <line x1="-8" y1="105" x2="8" y2="105" stroke="#ecf0f1" stroke-width="2"/>
    <text x="-35" y="109" fill="#ecf0f1" font-family="monospace" font-size="9">Z=3</text>
    
    <!-- Z=1 water surface -->
    <line x1="-8" y1="155" x2="8" y2="155" stroke="#ecf0f1" stroke-width="2"/>
    <text x="-35" y="159" fill="#ecf0f1" font-family="monospace" font-size="9">Z=1</text>
    
    <!-- Z=0 riverbed -->
    <line x1="-8" y1="180" x2="8" y2="180" stroke="#ecf0f1" stroke-width="2"/>
    <text x="-35" y="184" fill="#ecf0f1" font-family="monospace" font-size="9">Z=0</text>
    
    <!-- Bottom of riverbed area -->
    <line x1="-8" y1="330" x2="8" y2="330" stroke="#ecf0f1" stroke-width="2"/>
    <text x="-55" y="334" fill="#ecf0f1" font-family="monospace" font-size="9">riverbed</text>
    <text x="-55" y="344" fill="#ecf0f1" font-family="monospace" font-size="9">bottom</text>
  </g>
  
  <!-- Labels -->
  <g font-family="monospace" font-size="11" fill="#ecf0f1">
    <text x="470" y="70" opacity="0.8">WALKWAY</text>
    <text x="470" y="148" opacity="0.8">WALL FACE</text>
    <text x="470" y="195" opacity="0.8">WATER (Z=1)</text>
    <text x="470" y="250" opacity="0.8">RIVERBED (Z=0)</text>
    <text x="470" y="265" opacity="0.8">seen through</text>
    <text x="470" y="280" opacity="0.8">water</text>
  </g>
  
  <!-- Projection formula box -->
  <g transform="translate(50, 460)">
    <rect x="-10" y="-15" width="200" height="70" fill="#2c3e50" rx="5" stroke="#3d5166" stroke-width="1"/>
    <text x="0" y="5" fill="#f39c12" font-family="monospace" font-size="12" font-weight="bold">Projection:</text>
    <text x="0" y="25" fill="#ecf0f1" font-family="monospace" font-size="11">screenX = worldX</text>
    <text x="0" y="42" fill="#ecf0f1" font-family="monospace" font-size="11">screenY = worldY - worldZ</text>
  </g>
  
  <!-- Coordinate legend box -->
  <g transform="translate(350, 460)">
    <rect x="-10" y="-15" width="200" height="70" fill="#2c3e50" rx="5" stroke="#3d5166" stroke-width="1"/>
    <text x="0" y="5" fill="#ecf0f1" font-family="monospace" font-size="12" font-weight="bold">World Coords:</text>
    <text x="0" y="22" fill="#e74c3c" font-family="monospace" font-size="10">X = left/right</text>
    <text x="0" y="36" fill="#2ecc71" font-family="monospace" font-size="10">Y = depth (toward river)</text>
    <text x="0" y="50" fill="#3498db" font-family="monospace" font-size="10">Z = height</text>
  </g>
  
  <!-- Title -->
  <text x="300" y="545" text-anchor="middle" fill="#ecf0f1" font-family="monospace" font-size="13" font-weight="bold">Magnet Fishing - Orthogonal Projection (debug view)</text>
  
</svg>